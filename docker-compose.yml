services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: 3d-scanner:latest
    container_name: 3d-scanner
    volumes:
      - ./input_images:/app/input_images
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
